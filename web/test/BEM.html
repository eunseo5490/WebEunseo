<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body{
            margin:0px;
            padding:10px;
            background-color: #f9fafa;

            display: flex;
            gap:10px;
        }

        .product-card{
            background-color: #fcfcfc;
            border:1px solid gray;
            border-radius: 12px;
            width:200px;
            height:300px;
            padding:10px;
            display: inline-block;
        }

        .product-card.card__soldout{
            background-color: #f5f5f5;
            opacity:0.6;
        }

        /* block에 종속된 하위 요소들 */
        .product-card__image{
            border:1px solid lightgray;
            border-radius: 12px;
            width:100%;
            height:60%;
            object-fit: cover;
            background-color: #e5e5e5;
            display:flex;
            justify-content: center;
            align-items: center;
            color:#aaa;
        }
    
        .product-card__title{
            font-size:18px;
            font-weight: bold;
            margin:10px 0;
        }

        .product-card__price{
            color:#e74c3c;
        }

        /* modi */











    </style>
</head>
<body>
    
    <div class="product-card">
        <div class="product-card__image">IMAGE</div>
        <div class="product-card__title">기본 후드티</div>
        <div class="product-card__price">39,000원</div>
    </div>

    <div class="product-card card__soldout">
        <div class="product-card__image">IMAGE</div>
        <div class="product-card__title">레이어드 맨투맨 [품절]</div>
        <div class="product-card__price">19,000원</div>
    </div>

</body>
</html>
