<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .badge{
            display: inline-block;
            padding : 10px 14px;
            border-radius: 999;
            background-color: #8e44ad;
            color: white;
            font-weight: 700;
            /* step(단계수, 위치)
            애니메이션을 일정한 단계로 끊어서 움직이게 만드는 타이밍 함수*/
            animation: hop 0.8s steps(4, start) infinite alternate
        }

        @keyframes hop{
            from{
                transform: translateX(0)
            }
            
            to{
                transform: translateX(80px);
            }
        }
    </style>
</head>
<body>
    
</body>
</html>
