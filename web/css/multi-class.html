<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .btn{
            padding:10px 16px;
            border-radius:8px;
            font-size:16px;
        }

        .primary{
            background: #3498db;
            color:#fff;
        }

        .danger{
            background: #e74c3c;
            color:#fff;

        }

        .large{
            font-size:18px;
            padding:12px 18px;
        }

        /*  */
        .btn.primary{
            border:2px solid #21618c;
        }

        .btn.danger{
            border:2px solid #922b21;
        }

    </style>
</head>
<body>
    
    <button class="btm primary">확인</button>
    <button class="btm danger">삭제</button>
    <button class="btm primary large">확인(크게)</button>

</body>
</html>
