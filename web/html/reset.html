<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Reset CSS
     브라우저가 기본적으로 적용하는 CSS 스타일을 초기화하는 코드이다.
     HTML 태그들은 CSS를 작성하지 않아도 기본 스타일이 존재한다.
     H1 -> 글자가 크고 굵다
     P -> 위아래 여백이 있다.
     ul -> 왼쪽 들여쓰기가 있다.
     
     개발자가 원하는 디자인을 처음부터 통일해서 만들기 위해 사용한다. -->

     <!-- nomalize.css
      브라우저의 기본 스타일을 완전히 제거하는 것이 아니라, 브라우저마다 다르게 적용되는 부분을 통일해주는 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reset-css@5.0.2/reset.min.css">
    <title>Document</title>
</head>
<body>
    <h1>Normalize.css</h1>
    
</body>
</html>
