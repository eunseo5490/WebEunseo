<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body{
            margin:0px;
            padding:0px;
            text-align: center;
            
            font-family:arial;
            

            
        }

        header{
            width:100%;
            height: 100px;
            background-color: #2ecc71;

            color:white;
        }

        nav{
            background-color: #27ae60;
            color:white;
            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        ul{
            display: flex;
            justify-content: center;
            align-items: center;
            gap:20px;
        }

        main{
            padding: 20px;
            background-color: #ecf0f1;
            color:black;

            display: flex;
            justify-content: center;
            align-items: center;
            gap:20px;
            
        }

        section{
            background-color: #ffffff;
            color:black;

            flex: 60%
        }

        aside{
            background-color: #dfe6e9;
            color:black;

            flex: 40%
        }

        footer{
            width:100%;
            height: 60px;
            background-color: #34495e;
            color:white;

            display: flex;
            justify-content: center;
            align-items: center;
        }


    </style>
</head>
<body>

    <header>
        <h1>Flexbox Layout 연습</h1>
    </header>

    <nav>
        <ul>
            <li>홈</li>
            <li>공지사항</li>
            <li>문의</li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>메인 콘텐츠</h2>
            <p>이 영역은 본문 애용을 표시하는 구역이다.</p>
            <p>Flexbox를 이용해 왼쪽에 배치된다.</p>
        </section>

        <aside>
            <h2>사이드바</h2>
            <p>보조 정보나 공지사항을 표시하는 구역이다.</p>
        </aside>
    </main>

    <footer>
        <p>&copy; 2025 Flex Layout Practice</p>
    </footer>
    
</body>
</html>
