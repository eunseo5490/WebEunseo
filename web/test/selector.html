<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        /* 기본 카드 스타일 (.card)
        모든 알림 카드는 공통적으로 padding 15px, border 1px solid #ccc, border-radius 4px을 가집니다. */
        .card{
            padding:15px;
            border:1px solid #ccc;
            border-radius:4px;
        }

        .card.success{
            border-color: #2ecc71;
            background-color: #e8f8f5;
        }

        .card.warning{
            border-color: #f1c40f;
            background-color: #fef9ec;
        }

        .card.danger{
            border-color: #e74c3c;
            background-color: #fdedec;
        }

        .danger.critical{
            background-color: #c0392b;
            color:#fff;
        }








    </style>
</head>
<body>
    
    <h1>문제 1번</h1>
    <div class="card success">성공 메시지</div>
    <div class="card warning">경고 메시지</div>
    <div class="card danger">오류 메시지</div>
    <div class="card danger critical">매우 심각한 오류 메시지</div>








</body>
</html>
